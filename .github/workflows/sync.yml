name: Sync iCloud Obsidian Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # 매일 03:00 UTC (KST 12:00)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Write rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Sync iCloud -> repo content/
        env:
          REMOTE: ${{ secrets.RCLONE_REMOTE_NAME }}
        run: |
          set -euo pipefail
          REMOTE_NAME="${REMOTE:-iclouddrive}"

          # iCloud의 경로: .Obsidian/english/content
          SRC="${REMOTE_NAME}:Obsidian/english/"
          DST="content"
          bun scripts/sync.ts --remotePath=${SRC}

      - name: Commit & push if changed
        run: |
          set -euo pipefail

          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add content
            git commit -m "Sync content from iCloud (.obsidian/english/content)"
            git push
          else
            echo "No changes."
          fi
