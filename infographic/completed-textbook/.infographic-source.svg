<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08" />
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="10" stdDeviation="6" flood-color="#17324D" flood-opacity="0.18" />
    </filter>
    <style>
      .title { font-family: "Pretendard", "Arial", sans-serif; font-weight: 800; fill: #17324D; }
      .label { font-family: "Pretendard", "Arial", sans-serif; font-weight: 700; fill: #17324D; }
      .small { font-family: "Pretendard", "Arial", sans-serif; font-weight: 600; fill: #17324D; }
      .tiny { font-family: "Pretendard", "Arial", sans-serif; font-weight: 600; fill: #36506A; }
      .ink { stroke: #17324D; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #17324D; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #17324D; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1 18; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFF8F0" />
  <rect width="1600" height="900" filter="url(#paperNoise)" opacity="0.8" />
  <circle cx="1390" cy="120" r="220" fill="#F6C445" opacity="0.35" />
  <circle cx="210" cy="760" r="260" fill="#BFE8DC" opacity="0.45" />
  <path d="M 0 660 C 220 570, 330 710, 530 635 C 760 550, 850 690, 1040 625 C 1250 552, 1360 615, 1600 540 L 1600 900 L 0 900 Z" fill="#F9DF8C" opacity="0.45" />

  <text class="title" x="80" y="88" font-size="54">I've finally completed one of English text books</text>
  <text class="tiny" x="84" y="128" font-size="22">A 100-day English textbook routine, redrawn as a handmade study map</text>

  <path d="M 270 430 C 430 350, 530 440, 674 420 C 825 398, 910 318, 1060 382 C 1214 448, 1326 426, 1455 330" fill="none" class="ink" opacity="0.9" />
  <path d="M 270 468 C 430 388, 530 478, 674 458 C 825 436, 910 356, 1060 420 C 1214 486, 1326 464, 1455 368" fill="none" stroke="#E95F52" stroke-width="5" stroke-linecap="round" opacity="0.75" />

  <g transform="translate(88 214) rotate(-5)" filter="url(#softShadow)">
    <rect x="0" y="0" width="265" height="354" rx="20" fill="#F6C445" class="thin" />
    <rect x="28" y="88" width="210" height="180" rx="12" fill="#FFFDF6" class="thin" transform="rotate(-4 133 178)" />
    <text class="small" x="132" y="52" text-anchor="middle" font-size="20">50-day diary</text>
    <text class="label" x="132" y="146" text-anchor="middle" font-size="29" fill="#168152">Gabriel's</text>
    <text class="label" x="132" y="190" text-anchor="middle" font-size="34" fill="#E95F52">English</text>
    <text class="label" x="132" y="232" text-anchor="middle" font-size="34" fill="#E95F52">Diary</text>
    <path d="M 44 292 L 76 278 L 102 325 L 70 340 Z" fill="#5D76B7" class="thin" />
    <path d="M 128 286 C 158 270, 198 280, 218 306 C 188 295, 156 310, 128 286 Z" fill="#BFE8DC" class="thin" />
    <line x1="44" y1="318" x2="33" y2="340" class="thin" />
    <line x1="228" y1="298" x2="238" y2="322" class="thin" />
  </g>

  <g transform="translate(96 618)">
    <rect x="0" y="0" width="270" height="112" rx="20" fill="#FFFFFF" class="thin" />
    <text class="label" x="28" y="42" font-size="30">Completed</text>
    <text class="title" x="28" y="86" font-size="42" fill="#E95F52">100 days</text>
  </g>

  <g transform="translate(394 302)" filter="url(#softShadow)">
    <rect x="0" y="0" width="210" height="148" rx="18" fill="#FFFFFF" class="thin" />
    <text class="title" x="105" y="54" text-anchor="middle" font-size="42" fill="#168152">50</text>
    <text class="label" x="105" y="92" text-anchor="middle" font-size="28">chapters</text>
    <text class="tiny" x="105" y="124" text-anchor="middle" font-size="19">50 stories</text>
    <rect x="-18" y="100" width="90" height="58" rx="10" fill="#F9DF8C" class="thin" transform="rotate(-8 27 129)" />
    <rect x="138" y="102" width="90" height="58" rx="10" fill="#BFE8DC" class="thin" transform="rotate(9 183 131)" />
  </g>

  <g transform="translate(632 515)" filter="url(#softShadow)">
    <rect x="0" y="0" width="250" height="146" rx="22" fill="#FFFDF6" class="thin" />
    <text class="label" x="125" y="43" text-anchor="middle" font-size="28">Every other day</text>
    <line x1="40" y1="82" x2="210" y2="82" class="dash" />
    <circle cx="46" cy="82" r="15" fill="#168152" class="thin" />
    <circle cx="100" cy="82" r="15" fill="#F6C445" class="thin" />
    <circle cx="154" cy="82" r="15" fill="#168152" class="thin" />
    <circle cx="208" cy="82" r="15" fill="#F6C445" class="thin" />
    <text class="tiny" x="125" y="126" text-anchor="middle" font-size="20">about 100 days</text>
  </g>

  <g transform="translate(808 248)" filter="url(#softShadow)">
    <rect x="0" y="0" width="220" height="150" rx="22" fill="#FFFFFF" class="thin" />
    <circle cx="74" cy="76" r="44" fill="#BFE8DC" class="thin" />
    <line x1="74" y1="76" x2="74" y2="45" class="thin" />
    <line x1="74" y1="76" x2="102" y2="92" class="thin" />
    <text class="title" x="150" y="68" text-anchor="middle" font-size="28" fill="#E95F52">40 ~ 60</text>
    <text class="label" x="150" y="102" text-anchor="middle" font-size="24">min</text>
    <text class="tiny" x="150" y="128" text-anchor="middle" font-size="17">per chapter</text>
  </g>

  <g transform="translate(908 500)" filter="url(#softShadow)">
    <rect x="0" y="0" width="398" height="190" rx="24" fill="#FFFDF6" class="thin" />
    <text class="label" x="28" y="42" font-size="30">Study loop</text>
    <g transform="translate(34 72)">
      <circle cx="34" cy="34" r="31" fill="#F6C445" class="thin" />
      <path d="M 18 36 C 18 14, 50 14, 50 36" fill="none" class="thin" />
      <rect x="14" y="34" width="13" height="26" rx="5" fill="#17324D" />
      <rect x="41" y="34" width="13" height="26" rx="5" fill="#17324D" />
      <text class="tiny" x="34" y="94" text-anchor="middle" font-size="14">listen twice</text>
    </g>
    <path d="M 100 106 L 124 106" class="thin" />
    <g transform="translate(124 72)">
      <circle cx="34" cy="34" r="31" fill="#BFE8DC" class="thin" />
      <path d="M 17 20 C 32 12, 38 18, 51 20 L 51 55 C 38 50, 31 50, 17 55 Z" fill="#FFFFFF" class="thin" />
      <line x1="34" y1="18" x2="34" y2="54" class="thin" />
      <text class="tiny" x="34" y="94" text-anchor="middle" font-size="14">read</text>
    </g>
    <path d="M 190 106 L 214 106" class="thin" />
    <g transform="translate(214 72)">
      <circle cx="34" cy="34" r="31" fill="#FAD2CF" class="thin" />
      <rect x="18" y="18" width="37" height="28" rx="6" fill="#FFFFFF" class="thin" transform="rotate(-8 36 32)" />
      <rect x="24" y="28" width="37" height="28" rx="6" fill="#F9DF8C" class="thin" transform="rotate(8 42 42)" />
      <text class="tiny" x="34" y="90" text-anchor="middle" font-size="13">Anki</text>
      <text class="tiny" x="34" y="106" text-anchor="middle" font-size="13">cards</text>
    </g>
    <path d="M 280 106 L 304 106" class="thin" />
    <g transform="translate(304 72)">
      <circle cx="34" cy="34" r="31" fill="#FFFFFF" class="thin" />
      <path d="M 17 22 H 51 Q 60 22 60 34 V 39 Q 60 51 48 51 H 38 L 28 60 L 30 51 H 17 Q 8 51 8 39 V 34 Q 8 22 17 22 Z" fill="#BFE8DC" class="thin" />
      <text class="tiny" x="34" y="90" text-anchor="middle" font-size="13">speak</text>
      <text class="tiny" x="34" y="106" text-anchor="middle" font-size="13">10x</text>
    </g>
  </g>

  <g transform="translate(1130 228)" filter="url(#softShadow)">
    <rect x="0" y="0" width="250" height="144" rx="22" fill="#FFFFFF" class="thin" />
    <text class="label" x="28" y="45" font-size="29">Hard to keep up</text>
    <text class="tiny" x="28" y="78" font-size="18">missed some days</text>
    <text class="tiny" x="28" y="108" font-size="18">plenty of Anki cards</text>
    <rect x="200" y="80" width="38" height="30" rx="7" fill="#F9DF8C" class="thin" transform="rotate(10 219 95)" />
    <rect x="178" y="68" width="44" height="34" rx="8" fill="#FAD2CF" class="thin" transform="rotate(-8 200 85)" />
    <path d="M 224 58 L 236 46 M 232 118 L 250 122 M 214 126 L 226 138" class="thin" />
  </g>

  <g transform="translate(1304 514)" filter="url(#softShadow)">
    <rect x="0" y="0" width="220" height="158" rx="28" fill="#168152" class="thin" />
    <circle cx="58" cy="76" r="36" fill="#FFFDF6" class="thin" />
    <path d="M 38 75 L 54 92 L 84 55" fill="none" stroke="#E95F52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <text class="label" x="154" y="62" text-anchor="middle" font-size="29" fill="#FFFDF6">Worth it</text>
    <text class="small" x="154" y="100" text-anchor="middle" font-size="21" fill="#FFFDF6">recommended</text>
    <text class="small" x="154" y="128" text-anchor="middle" font-size="21" fill="#FFFDF6">completed</text>
  </g>

  <g transform="translate(84 786)">
    <rect x="0" y="0" width="1430" height="58" rx="22" fill="#FFFFFF" opacity="0.78" class="thin" />
    <text class="small" x="30" y="38" font-size="22">Key routine:</text>
    <text class="tiny" x="180" y="38" font-size="21">listen twice</text>
    <circle cx="325" cy="31" r="5" fill="#E95F52" />
    <text class="tiny" x="350" y="38" font-size="21">read the contents</text>
    <circle cx="548" cy="31" r="5" fill="#E95F52" />
    <text class="tiny" x="574" y="38" font-size="21">create Anki flash cards</text>
    <circle cx="850" cy="31" r="5" fill="#E95F52" />
    <text class="tiny" x="876" y="38" font-size="21">repeat speaking drill 10 times for each sentence</text>
  </g>
</svg>
